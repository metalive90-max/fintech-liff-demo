<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101725"><title>台股當沖決策中心 V1</title><style>
*{box-sizing:border-box}body{font:16px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#0d1422;color:#e9f1ff;max-width:650px;margin:0 auto;padding:22px 16px}.sub{font-size:12px;color:#9aacbf}.card{background:#172236;border:1px solid #2c3d57;border-radius:16px;padding:17px;margin:14px 0}h1{font-size:24px;margin:5px 0 18px}h2{font-size:17px;margin:0 0 14px}.warn{background:#41301e;color:#ffdd9d;padding:14px;border-radius:12px;font-size:14px;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{padding:10px 6px;background:#213149;border-radius:10px}.stats b{font-size:18px;display:block;margin-top:8px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #304058;padding:11px 0}.tag{font-size:12px;color:#ffd79d}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#b3bfd1;font-size:13px;margin:8px 0}input:not([type=checkbox]){width:100%;background:#101a2b;color:white;border:1px solid #49607e;border-radius:9px;padding:10px;font-size:17px}button{background:#3a8df4;color:#fff;border:0;border-radius:10px;padding:14px;font-weight:bold;width:100%;margin-top:14px;font-size:16px}#result{white-space:pre-line;line-height:1.8;margin-top:12px;font-size:14px}footer{font-size:12px;line-height:1.7;color:#a0acc0;padding:10px 0 40px}</style></head><body>
<div class="sub">TW DAY TRADING • V1 • 無自動下單</div><h1>台股 AI 當沖決策中心</h1>
<div class="warn"><b>⚠️ 未接入正式行情</b><div>目前不會提供買進訊號。畫面僅供手動風險試算；取得合法即時資料後才能啟用監控。</div></div>
<section class="card"><h2>風險上限</h2><div class="stats"><div><span class="sub">交易額度</span><b>80 萬</b></div><div><span class="sub">虧損上限</span><b>1 萬</b></div><div><span class="sub">單筆最多</span><b>2 張</b></div></div><p class="sub">尚未連接國泰成交紀錄，不能累計整日已實現損益。</p></section>
<section class="card"><h2>監控清單 <span class="tag">資料未連線</span></h2><div id="watch">讀取中…</div><p id="time" class="sub"></p></section>
<section class="card"><h2>停損停利試算</h2><div class="fields"><div><label>買入價</label><input id="entry" type="number" value="228" step="0.5"></div><div><label>停損價</label><input id="stop" type="number" value="225" step="0.5"></div><div><label>停利價</label><input id="target" type="number" value="235" step="0.5"></div><div><label>張數</label><input id="lots" type="number" value="1" min="1" max="10"></div></div><label><input id="overnight" type="checkbox"> 隔日賣出（一般證交稅）</label><button id="calc">計算風險</button><div id="result"></div></section>
<footer>報價狀態：尚未授權／未連線。沒有任何國泰證券交易或下單權限。計算已納入估計交易費、稅與滑價緩衝，但停損成交價無法保證；隔夜跳空可能造成更大的損失。</footer>
<script>
const $=id=>document.getElementById(id), money=n=>Number(n).toLocaleString("zh-TW",{maximumFractionDigits:0});
async function poll(){try{const r=await fetch("/api/status",{cache:"no-store"}),s=await r.json();if(!r.ok)throw Error("status "+r.status);$("watch").innerHTML=s.symbols.map(x=>'<div class="row"><span>'+x.name+' <small class="sub">'+x.symbol+'</small></span><span class="tag">'+x.status+'</span></div>').join("");$("time").textContent="更新："+new Date(s.now).toLocaleString("zh-TW",{timeZone:"Asia/Taipei"});}catch(e){$("watch").textContent="讀取失敗："+e.message}}
$("calc").onclick=async()=>{let x={entry:Number($("entry").value),stop:Number($("stop").value),target:Number($("target").value),lots:Number($("lots").value),overnight:$("overnight").checked};try{let r=await fetch("/api/risk",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(x)}),d=await r.json();if(!r.ok)throw Error("輸入無效");$("result").textContent=d.message+"\n投入資金：NT$ "+money(d.capital)+"\n含滑價預估風險：NT$ "+money(d.risk_including_buffer)+"\n目標估算淨利：NT$ "+money(d.profit_target_estimate)+"\n報酬風險比："+d.risk_reward;}catch(e){$("result").textContent=e.message}};poll();setInterval(poll,60000);
</script></body></html>
